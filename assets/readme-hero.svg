<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI for healthcare and education</title>
  <desc id="desc">A ten-build learning roadmap from backend fundamentals to human-reviewed AI systems.</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00BFA5"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#009688"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#16313A" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="22" fill="#0B1117"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="url(#grid)" stroke="#26343D" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="5" rx="2.5" fill="url(#edge)"/>

  <g fill="none" stroke="#00BFA5" stroke-width="2" opacity=".7">
    <path d="M82 119h44v26h30"/>
    <path d="M1118 119h-44v26h-30"/>
    <path d="M82 268h64v-22h31"/>
    <path d="M1118 268h-64v-22h-31"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="156" cy="145" r="4"/>
    <circle cx="1044" cy="145" r="4"/>
    <circle cx="177" cy="246" r="4"/>
    <circle cx="1023" cy="246" r="4"/>
  </g>

  <text x="600" y="93" text-anchor="middle" fill="#B5C7CF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="5">A PROJECT-BASED FASTAPI ROADMAP</text>
  <text x="600" y="222" text-anchor="middle" fill="url(#teal)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="132" font-weight="900" letter-spacing="5">FASTAPI</text>
  <text x="600" y="272" text-anchor="middle" fill="#F1F5F9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="750" letter-spacing="3">HEALTHCARE <tspan fill="#52616B">×</tspan> EDUCATION <tspan fill="#52616B">×</tspan> AI</text>
  <text x="600" y="325" text-anchor="middle" fill="#91A3AD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="500">10 builds · from your first API to human-reviewed AI workflows</text>
</svg>
